<svg width="1000" height="1600" viewBox="0 0 1000 1600" fill="none"
     xmlns="http://www.w3.org/2000/svg">

<style>
  .bg { fill: #0b0e12; }
  .frame { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
  .block { fill: #10151c; stroke: #242b35; stroke-width: 1.2; }
  .block-soft { fill: #0d1218; stroke: #1f2630; stroke-width: 1.1; }
  .line { stroke: #242b35; stroke-width: 1; }

  .text {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                 "Liberation Mono", monospace;
    fill: #c7ced7;
    font-size: 14px;
    font-weight: 400;
  }

  .text-muted {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                 "Liberation Mono", monospace;
    fill: #76808d;
    font-size: 13px;
  }

  .title {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                 "Liberation Mono", monospace;
    fill: #f4f6f8;
    font-size: 29px;
    font-weight: 700;
  }

  .label {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                 "Liberation Mono", monospace;
    fill: #68717d;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.2px;
  }

  .green { fill: #8fc987; }
  .purple { fill: #b696cf; }
  .orange { fill: #d8954f; }
  .comment { fill: #66707c; }
  .string { fill: #a7c976; }
  .number { fill: #73aee6; }
  .keyword { fill: #d8954f; }

  .prompt {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                 "Liberation Mono", monospace;
    fill: #8fc987;
    font-size: 14px;
    font-weight: 600;
  }
</style>

<rect width="1000" height="1600" rx="24" class="bg"/>
<rect x="24" y="22" width="952" height="1550" rx="18" class="frame"/>

<!-- terminal bar -->
<circle cx="52" cy="52" r="6" fill="#e46b61"/>
<circle cx="73" cy="52" r="6" fill="#d3a14a"/>
<circle cx="94" cy="52" r="6" fill="#68ad71"/>

<text x="132" y="58" class="text">
  <tspan class="green">lua</tspan><tspan class="text-muted">@github:~</tspan>
</text>

<text x="736" y="58" class="label">DATA · IA · RISCO · CURIOSIDADE</text>
<line x1="42" y1="78" x2="958" y2="78" class="line"/>

<!-- HERO -->

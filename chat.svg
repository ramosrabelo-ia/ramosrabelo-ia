<text x="60" y="704" class="text">
  <tspan class="keyword">curiosidade</tspan> = <tspan class="green">True</tspan>
</text>

<text x="60" y="738" class="text">
  Nem tudo aqui nasceu de uma necessidade de negócio.
</text>
<text x="60" y="766" class="text">
  Alguns projetos existem simplesmente porque alguma pergunta,
</text>
<text x="60" y="794" class="text">

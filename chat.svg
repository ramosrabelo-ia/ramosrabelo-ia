</text>

<text x="60" y="482" class="text">}</text>

<line x1="60" y1="500" x2="940" y2="500" class="line"/>
<text x="60" y="526" class="label">01.1 / PROJETO_DESTAQUE</text>

<text x="60" y="556" class="text">
